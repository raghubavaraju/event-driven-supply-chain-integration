# STATUS: Configuration placeholder — no real values. Never commit real credentials.

env: "${mule.env}"

kafka:
  bootstrap.servers: "kafka-fictional-broker-1.internal.example.com:9092,kafka-fictional-broker-2.internal.example.com:9092"
  security.protocol: "SASL_SSL"
  sasl.username: "${secure::kafka.sasl.username}"
  sasl.password: "${secure::kafka.sasl.password}"
  consumerGroupId: "fulfillment-event-consumer-group"
  topics:
    inventoryUpdated: "inventory.updated.v1"
    inventoryUpdatedDlq: "inventory.updated.v1.dlq"
    shipmentDispatched: "shipment.dispatched.v1"
    fulfillmentCompleted: "fulfillment.completed.v1"

warehouseApi:
  base.uri: "https://warehouse-mgmt.internal.example.com/api/v1"
  client.id: "${secure::warehouse.api.clientId}"
  client.secret: "${secure::warehouse.api.clientSecret}"
  timeout.ms: 8000

idempotency:
  objectStore.name: "fulfillmentProcessedEventsStore"
  ttl.days: 7

retry:
  max: 3
  backoff.ms: 750
